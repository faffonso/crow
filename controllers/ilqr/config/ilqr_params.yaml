## iterative Linear Quatratic Regulator

controller/iLQR:
  # Prediction Params
  N:      &N  15
  dt:     &dt 0.1
  v_ref:      0.9

  # Optimization Params
  shoot_fac:  0.1     # Exponential factor (exp(fac*x))
  max_iter:   50      # Max iterations of fit function
  tol:        0.01    # Min tolerance for convergence

controller/cost: 
  N: *N
  
  # Weight Matrices (Terminal Step - Final Goal)
  Qf_x:     5.0     # larger, more aggressive (final x precision)
  Qf_y:     5.0     # larger, more aggressive (final y precision)
  Qf_theta: 1.0     # larger, more aggressive (final heading precision)

  # Weight Matrices (Running Step - Path Tracking)
  Q_x:      5.0     # larger, more aggressive (path tracking x)
  Q_y:      5.0     # larger, more aggressive (path tracking y)
  Q_theta:  2.5     # larger, more aggressive (path tracking heading)

  # Control Costs (Smoothing)
  R_v:      2.0     # larger, less aggressive (smoother linear accel)
  R_omega:  0.5     # larger, less aggressive (smoother angular accel)

  v_max:      0.9
  omega_max:  1.0

  eps: 100
  t: 100

controller/dynamics:
  dt: *dt
  model: "error-tracking"

## Odometry Params
odom:
  topic: "/terrasentia/dlio/odom_node/odom"
  frame_id: "odom"